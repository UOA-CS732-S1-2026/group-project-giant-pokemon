services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MONGODB_URI: mongodb://mongo:27017/taskflow
        JWT_SECRET: docker-build-only-secret
    env_file:
      - docker.defaults.env
      - path: .env.docker
        required: false
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/taskflow
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
